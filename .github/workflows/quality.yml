name: MX-Idle Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium

      - name: Typecheck and production build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Start Vite for browser QA
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/mx-idle-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mx-idle-vite.log
          exit 1

      - name: Full Phase 1 browser smoke test
        env:
          BASE_URL: http://127.0.0.1:5173/
        run: npm run qa

      - name: Combat interface responsive and interaction smoke test
        env:
          BASE_URL: http://127.0.0.1:5173/
        run: npm run qa:combat-ui

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mx-idle-ui-smoke-screenshots
          path: artifacts/ui-generation-2-5/
          if-no-files-found: ignore
          retention-days: 7
